<div align="center">
    <h1>User Registration</h1>
    <h2 style="color: red;">{{ form.errorMessage }}</h2>
    <h2 style="color: green;">{{ form.successMessage }}</h2>
    <form (submit)="signUp()">

        <table>

            <tr>
                <th>First Name</th>
                <td><input type="text" name="firstName" [(ngModel)]="form.data.firstName"
                        placeholder="enter your first name"></td>
                <td style="color: red;">{{form.inputerror.firstName}}</td>
            </tr>

            <tr>
                <th>Last Name</th>
                <td><input type="text" name="lastName" [(ngModel)]="form.data.lastName"
                        placeholder="enter your last name"></td>
                <td style="color: red;">{{form.inputerror.lastName}}</td>
            </tr>

            <tr>
                <th>Login</th>
                <td><input type="email" name="login" [(ngModel)]="form.data.login" placeholder="enter you login"></td>
                <td style="color: red;">{{form.inputerror.login}}</td>
            </tr>

            <tr>
                <th>Password</th>
                <td><input type="password" name="password" [(ngModel)]="form.data.password"
                        placeholder="enter you password"></td>
                <td style="color: red;">{{form.inputerror.password}}</td>
            </tr>

            <tr>
                <th></th>
                <td><input type="submit" value="signUp"></td>
            </tr>

        </table>

    </form>

</div>
