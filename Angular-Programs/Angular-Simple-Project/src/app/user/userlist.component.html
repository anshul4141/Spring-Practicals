<div align="center">

    <h1>User List</h1>
    <h2 style="color: red;">{{form.errorMessage}}</h2>
    <h2 style="color: green;">{{form.successMessage}}</h2>

    <table>

        <tr>
            <th>First Name</th>
            <td><input type="text" name="firstName" [(ngModel)]="form.searchParam.firstName"
                    placeholder="search by firstName"></td>
            <td><button (click)="search()">search</button></td>
            <td><button (click)="reset()">reset</button></td>
        </tr>

    </table>

    <table width="100%" border="1px">

        <tr>
            <th>Delete</th>
            <th>Image</th>
            <th>Id</th>
            <th>FirstName</th>
            <th>LastName</th>
            <th>Role</th>
            <th>Login</th>
            <th>Edit</th>
        </tr>

        <tr *ngFor="let user of form.list" align="center">
            <td><input type="checkbox" (click)="onClickCheckBox(user.id)"></td>

            <td>{{user.lastName}}</td>
            <td>{{user.roleName}}</td>
            <td>{{user.login}}</td>
            <td><a (click)="edit('/user/'+user.id)">Edit</a></td>
        </tr>

    </table>

    <table width="100%">
        <tr>

            <td><button [disabled]="form.pageNo == 0" (click)="previous()">previous</button></td>
            <td align="center"><button (click)="delete()">delete</button></td>
            <td align="right"><button [disabled]="form.list.length < 5" (click)="next()">next</button></td>

        </tr>
    </table>

</div>
